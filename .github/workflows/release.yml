name: release

on:
    push:
        branches:
            - master
            - develop
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    windows:
        name: "Build | PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64"
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                ts: [nts, ts]
        steps:
            -   uses: actions/checkout@v7

            -   name: Determine the package version and validate release tags
                id: version
                shell: bash
                env:
                    REF_NAME: ${{ github.ref_name }}
                    REF_TYPE: ${{ github.ref_type }}
                run: |
                    version=$(sed -n 's/^#define PHP_PERFIDIOUS_VERSION "\(.*\)"/\1/p' php_perfidious.h)
                    if [[ -z "$version" ]]; then
                        echo "Missing extension version" >&2
                        exit 1
                    fi
                    if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
                        echo "Tag $REF_NAME does not match extension version $version" >&2
                        exit 1
                    fi
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"

            -   name: Include the license and exception in binary packages
                shell: bash
                run: cat LICENSE.md docs/LICENSE_EXCEPTION.md > LICENSE

            -   name: Build and test the Windows extension
                uses: php/php-windows-builder/extension@v1
                with:
                    extension-ref: ${{ steps.version.outputs.tag }}
                    php-version: "${{ matrix.php-version }}"
                    arch: x64
                    ts: "${{ matrix.ts }}"
                    args: --enable-perfidious
                    test-workers: "1"

            -   name: Install PHP for the packaged DLL check
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: "none"
                    tools: none
                    extensions: zip
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Check and extract the binary package
                shell: bash
                env:
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                run: |
                    php <<'PHP'
                    <?php
                    $prefix = sprintf('artifacts/php_perfidious-%s-%d.%d-%s-', getenv('RELEASE_TAG'), PHP_MAJOR_VERSION, PHP_MINOR_VERSION, PHP_ZTS ? 'ts' : 'nts');
                    $archives = glob($prefix . '*-x86_64.zip');
                    if ($archives === false || count($archives) !== 1) {
                        throw new RuntimeException('Expected one binary package for this PHP configuration');
                    }
                    $zip = new ZipArchive();
                    if ($zip->open($archives[0]) !== true) {
                        throw new RuntimeException('Cannot open binary package');
                    }
                    $license = file_get_contents('LICENSE.md') . file_get_contents('docs/LICENSE_EXCEPTION.md');
                    if ($zip->getFromName('LICENSE') !== $license) {
                        throw new RuntimeException('Binary package is missing the complete license and exception');
                    }
                    $dll = pathinfo($archives[0], PATHINFO_FILENAME) . '.dll';
                    if ($zip->locateName($dll) === false) {
                        throw new RuntimeException('Binary package DLL name does not match its archive');
                    }
                    $directory = getenv('RUNNER_TEMP') . '/perfidious-package';
                    if (!$zip->extractTo($directory)) {
                        throw new RuntimeException('Cannot extract binary package');
                    }
                    $zip->close();
                    if (file_put_contents(getenv('GITHUB_ENV'), 'PACKAGE_DLL=' . $directory . '/' . $dll . PHP_EOL, FILE_APPEND) === false) {
                        throw new RuntimeException('Cannot export the packaged DLL path');
                    }
                    PHP

            -   name: Verify the packaged version and sampler
                shell: bash
                env:
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                    EXPECTED_TS: ${{ matrix.ts }}
                run: |
                    php -n -d "extension=$PACKAGE_DLL" --ri perfidious
                    php -n -d "extension=$PACKAGE_DLL" -r 'if (phpversion("perfidious") !== substr(getenv("RELEASE_TAG"), 1) || (PHP_ZTS ? "ts" : "nts") !== getenv("EXPECTED_TS")) { throw new RuntimeException("Packaged release or PHP thread-safety mode does not match the matrix"); }'
                    # PHP expands these variables, not Bash.
                    # shellcheck disable=SC2016
                    php -n -d "extension=$PACKAGE_DLL" -r '$sampler = Perfidious\Sampler::open([Perfidious\Metric::CpuTime]); $sampler->read(); $sampler->close();'

    macos:
        name: "Build | PHP ${{ matrix.php-version }} ${{ matrix.ts }} arm64 macOS"
        runs-on: macos-15
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                ts: [nts, ts]
        env:
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            EXPECTED_TS: ${{ matrix.ts }}
            EXPECTED_PHP_VERSION: ${{ matrix.php-version }}
        steps:
            -   uses: actions/checkout@v7

            -   name: Determine the package version and validate release tags
                id: version
                shell: bash
                env:
                    REF_NAME: ${{ github.ref_name }}
                    REF_TYPE: ${{ github.ref_type }}
                run: |
                    version=$(sed -n 's/^#define PHP_PERFIDIOUS_VERSION "\(.*\)"/\1/p' php_perfidious.h)
                    if [[ -z "$version" ]]; then
                        echo "Missing extension version" >&2
                        exit 1
                    fi
                    if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
                        echo "Tag $REF_NAME does not match extension version $version" >&2
                        exit 1
                    fi
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: "none"
                    tools: none
                    extensions: json, opcache
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Verify the PHP build
                run: |
                    test "$(lipo -archs "$(command -v php)")" = arm64
                    php -r 'if (PHP_OS_FAMILY !== "Darwin" || PHP_DEBUG || PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION !== getenv("EXPECTED_PHP_VERSION") || (PHP_ZTS ? "ts" : "nts") !== getenv("EXPECTED_TS")) { throw new RuntimeException("PHP does not match the macOS release matrix"); }'

            -   name: Download and verify PIE
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    curl --proto '=https' --tlsv1.2 -fL \
                        --output "${RUNNER_TEMP}/pie.phar" \
                        https://github.com/php/pie/releases/latest/download/pie.phar
                    gh attestation verify --repo php/pie "${RUNNER_TEMP}/pie.phar"
                    php "${RUNNER_TEMP}/pie.phar" --version

            -   name: Build and install from checkout with PIE
                run: php "${RUNNER_TEMP}/pie.phar" install --no-interaction --no-cache

            -   name: Verify the installed extension
                run: php --ri perfidious

            -   name: Run the test suite
                run: |
                    # make test reports success without running tests if its configured PHP path is missing.
                    php_executable=$(command -v php)
                    make test PHP_EXECUTABLE="$php_executable"
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   name: Print test failure diagnostics
                if: failure()
                run: find tests -type f \( -name '*.log' -o -name '*.diff' -o -name '*.mem' \) -print -exec cat {} \;

            -   name: Check the packaging script
                run: python3 tests/package-darwin.py

            -   name: Package the ARM64 module
                id: package
                env:
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                run: |
                    archive=$(bash tools/package-darwin.sh "$RELEASE_TAG" "${RUNNER_TEMP}/packages")
                    unzip -q "$archive" -d "${RUNNER_TEMP}/perfidious-package"
                    cmp LICENSE.md "${RUNNER_TEMP}/perfidious-package/LICENSE.md"
                    cmp docs/LICENSE_EXCEPTION.md "${RUNNER_TEMP}/perfidious-package/LICENSE_EXCEPTION.md"
                    echo "archive=$archive" >> "$GITHUB_OUTPUT"
                    echo "name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

            -   name: Verify the packaged version and sampler
                env:
                    RELEASE_TAG: ${{ steps.version.outputs.tag }}
                run: |
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" --ri perfidious
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" -r 'if (phpversion("perfidious") !== substr(getenv("RELEASE_TAG"), 1)) { throw new RuntimeException("Packaged extension version does not match the release"); }'
                    # PHP expands these variables, not Bash.
                    # shellcheck disable=SC2016
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" -r '$sampler = Perfidious\Sampler::open([Perfidious\Metric::CpuTime]); $sampler->read(); $sampler->close();'

            -   name: Upload the binary package
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ steps.package.outputs.name }}
                    path: ${{ steps.package.outputs.archive }}
                    if-no-files-found: error

    linux:
        name: "Build | PHP ${{ matrix.php-version }} nts x64 Linux ${{ matrix.libc }}"
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                libc: [glibc, musl]
                include:
                    -   libc: glibc
                        image: bookworm
                    -   libc: musl
                        image: alpine3.22
        steps:
            -   uses: actions/checkout@v7

            -   name: Determine the package version and validate release tags
                id: version
                env:
                    REF_NAME: ${{ github.ref_name }}
                    REF_TYPE: ${{ github.ref_type }}
                run: |
                    version=$(sed -n 's/^#define PHP_PERFIDIOUS_VERSION "\(.*\)"/\1/p' php_perfidious.h)
                    if [[ -z "$version" ]]; then
                        echo "Missing extension version" >&2
                        exit 1
                    fi
                    if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
                        echo "Tag $REF_NAME does not match extension version $version" >&2
                        exit 1
                    fi
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"
                    echo "version=$version" >> "$GITHUB_OUTPUT"

            -   uses: cachix/install-nix-action@v31
                with:
                    extra_nix_config: |
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=

            -   name: Build and check the release package with Nix
                env:
                    RELEASE_PHP: ${{ matrix.php-version }}
                    RELEASE_LIBC: ${{ matrix.libc }}
                run: |
                    nix build -L --no-link .#checks.x86_64-linux.release-packaging
                    nix build -L ".#release-php${RELEASE_PHP//./}-${RELEASE_LIBC}"

            -   name: Test the ZIP in a PHP installation without Nix
                env:
                    EXPECTED_VERSION: ${{ steps.version.outputs.version }}
                    EXPECTED_PHP_VERSION: ${{ matrix.php-version }}
                    RELEASE_LIBC: ${{ matrix.libc }}
                    RELEASE_IMAGE: ${{ matrix.image }}
                run: |
                    archive="php_perfidious-v${EXPECTED_VERSION}_php${EXPECTED_PHP_VERSION}-x86_64-linux-${RELEASE_LIBC}-nts.zip"
                    docker run --rm \
                        -v "$PWD:/source:ro" -v "$(readlink -f result):/packages:ro" \
                        -e EXPECTED_VERSION -e EXPECTED_PHP_VERSION \
                        "php:${EXPECTED_PHP_VERSION}-cli-${RELEASE_IMAGE}" \
                        sh /source/tools/test-linux-release.sh "/packages/$archive"

            -   name: Upload the binary package
                uses: actions/upload-artifact@v7
                with:
                    name: php_perfidious-${{ steps.version.outputs.tag }}_php${{ matrix.php-version }}-x86_64-linux-${{ matrix.libc }}-nts.zip
                    path: result/*.zip
                    if-no-files-found: error

    publish:
        name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        needs: [windows, macos, linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Create the release and upload binary packages
                uses: php/php-windows-builder/release@v1
                with:
                    release: ${{ github.ref }}
                    draft: "true"

            -   name: Publish the completed release
                env:
                    GH_TOKEN: ${{ github.token }}
                    RELEASE_TAG: ${{ github.ref_name }}
                run: |
                    gh release edit "$RELEASE_TAG" --draft=false \
                        --notes "See [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)."

    pie:
        name: "PIE | PHP ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.os }}"
        needs: publish
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-2022, macos-15]
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                ts: [nts, ts]
        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: "none"
                    tools: none
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Verify ARM64 PHP on macOS
                if: runner.os == 'macOS'
                shell: bash
                run: test "$(lipo -archs "$(command -v php)")" = arm64

            -   name: Download and verify PIE
                shell: bash
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    curl --proto '=https' --tlsv1.2 -fL \
                        --output "${RUNNER_TEMP}/pie.phar" \
                        https://github.com/php/pie/releases/latest/download/pie.phar
                    gh attestation verify --repo php/pie "${RUNNER_TEMP}/pie.phar"
                    php "${RUNNER_TEMP}/pie.phar" --version

            -   name: Install the tagged release with PIE
                shell: bash
                env:
                    RELEASE_TAG: ${{ github.ref_name }}
                run: |
                    php "${RUNNER_TEMP}/pie.phar" repository:add vcs "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" --no-interaction
                    php "${RUNNER_TEMP}/pie.phar" install "jbboehr/perfidious:${RELEASE_TAG}" --no-interaction --no-cache --no-ansi | tee "${RUNNER_TEMP}/pie-install.log"
                    if [[ "$RUNNER_OS" == macOS ]]; then
                        grep -F 'Pre-packaged binary found:' "${RUNNER_TEMP}/pie-install.log"
                    fi

            -   name: Verify the installed version and sampler
                shell: bash
                env:
                    RELEASE_TAG: ${{ github.ref_name }}
                    EXPECTED_TS: ${{ matrix.ts }}
                run: |
                    php --ri perfidious
                    php -r 'if (phpversion("perfidious") !== substr(getenv("RELEASE_TAG"), 1) || (PHP_ZTS ? "ts" : "nts") !== getenv("EXPECTED_TS")) { throw new RuntimeException("Installed release or PHP thread-safety mode does not match the matrix"); }'
                    # PHP expands these variables, not Bash.
                    # shellcheck disable=SC2016
                    php -r '$sampler = Perfidious\Sampler::open([Perfidious\Metric::CpuTime]); $sampler->read(); $sampler->close();'

    pie-linux:
        name: "PIE | PHP ${{ matrix.php-version }} nts x64 Linux ${{ matrix.libc }}"
        needs: publish
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                libc: [glibc, musl]
                include:
                    -   libc: glibc
                        image: bookworm
                    -   libc: musl
                        image: alpine3.22
        steps:
            -   uses: actions/checkout@v7

            -   name: Download and verify PIE
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    curl --proto '=https' --tlsv1.2 -fL \
                        --output "${RUNNER_TEMP}/pie.phar" \
                        https://github.com/php/pie/releases/latest/download/pie.phar
                    gh attestation verify --repo php/pie "${RUNNER_TEMP}/pie.phar"

            -   name: Install and check the published binary in a fresh container
                env:
                    RELEASE_TAG: ${{ github.ref_name }}
                    EXPECTED_PHP_VERSION: ${{ matrix.php-version }}
                    RELEASE_IMAGE: ${{ matrix.image }}
                run: |
                    export EXPECTED_VERSION="${RELEASE_TAG#v}"
                    export RELEASE_REPOSITORY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
                    docker run --rm \
                        -v "$PWD:/source:ro" -v "${RUNNER_TEMP}/pie.phar:/pie.phar:ro" \
                        -e RELEASE_TAG -e RELEASE_REPOSITORY -e EXPECTED_VERSION -e EXPECTED_PHP_VERSION \
                        "php:${EXPECTED_PHP_VERSION}-cli-${RELEASE_IMAGE}" sh -eu -c '
                            if command -v apk >/dev/null; then
                                apk add --no-cache git unzip
                            else
                                apt-get update
                                apt-get install -y --no-install-recommends git unzip
                            fi
                            php /pie.phar repository:add vcs "$RELEASE_REPOSITORY" --no-interaction
                            php /pie.phar install "jbboehr/perfidious:$RELEASE_TAG" --no-interaction --no-cache --no-ansi > /tmp/pie-install.log 2>&1 || {
                                cat /tmp/pie-install.log
                                exit 1
                            }
                            cat /tmp/pie-install.log
                            grep -F "Pre-packaged binary found:" /tmp/pie-install.log
                            php /source/tools/check-linux-release.php
                        '
