name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
            - "windows/**"
            - "darwin/**"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2
                    extensions: json, opcache

            -   name: Validate composer.json and composer.lock
                run: composer validate --strict

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v6
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --ignore-platform-req=php+ --ignore-platform-req=ext-perfidious

            -   run: php -l perfidious.stub.php && php perfidious.stub.php

            -   name: phpcs
                run: php vendor/bin/phpcs

            -   name: phpstan
                run: php vendor/bin/phpstan analyze

    pie:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "PIE | PHP 8.1"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y libcap-dev libpfm4-dev

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "8.1"
                    tools: composer:v2

            -   name: Download and verify PIE
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    curl --proto '=https' --tlsv1.2 -fL \
                        --output "${RUNNER_TEMP}/pie.phar" \
                        https://github.com/php/pie/releases/latest/download/pie.phar
                    gh attestation verify --repo php/pie "${RUNNER_TEMP}/pie.phar"
                    php "${RUNNER_TEMP}/pie.phar" --version

            -   name: Install extension from checkout with PIE
                run: sudo php "${RUNNER_TEMP}/pie.phar" install --no-interaction --no-cache

            -   name: Verify extension is loaded
                run: php --ri perfidious

    windows:
        if: >-
            ${{
                github.event_name != 'push' ||
                !startsWith(github.ref_name, 'darwin/')
            }}
        runs-on: windows-2022
        name: "Windows | PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: "8.1"
                      ts: nts
                    - php-version: "8.4"
                      ts: nts
                    - php-version: "8.4"
                      ts: ts
                    - php-version: "8.5"
                      ts: nts
        steps:
            -   uses: actions/checkout@v7

            -   name: Build and test the Windows extension
                uses: php/php-windows-builder/extension@v1
                with:
                    php-version: "${{ matrix.php-version }}"
                    arch: x64
                    ts: "${{ matrix.ts }}"
                    args: --enable-perfidious
                    test-workers: "1"

    macos:
        if: >-
            ${{
                github.event_name != 'push' ||
                !startsWith(github.ref_name, 'windows/')
            }}
        name: "macOS | PHP ${{ matrix.php-version }} ${{ matrix.arch }}"
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: "8.1"
                      arch: x64
                      runner: macos-15-intel
                    - php-version: "8.5"
                      arch: arm64
                      runner: macos-15
        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"

            -   run: phpize

            -   run: ./configure --enable-compile-warnings=error

            -   run: make

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   run: cat tests/*.log
                if: failure()

            -   name: Verify extension is loaded
                run: php -n -d extension="$(pwd)/modules/perfidious.so" --ri perfidious

    test:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }} ${{ matrix.debug }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                debug:
                    - ""
                include:
                    - php-version: "8.1"
                      debug: "debug"
                    - php-version: "8.4"
                      debug: "debug"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y libcap-dev libpfm4-dev valgrind

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2

            -   run: phpize

            -   name: Compile a Linux consumer of the installed public header
                run: |
                    read -r -a php_includes <<< "$(php-config --includes)"
                    cc "${php_includes[@]}" -I. -fsyntax-only tests/header-linux-consumer.c

            -   run: ./configure --enable-compile-warnings=error "${EXTRA_FLAGS}"
                env:
                    EXTRA_FLAGS: ${{ matrix.debug == 'debug' && '--enable-perfidious-debug' || '' }}

            -   run: make

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   run: make test TEST_PHP_ARGS='-m'
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1
                    USE_ZEND_ALLOC: 0

            -   run: cat tests/*.log
                if: failure()


    coverage:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Coverage | PHP ${{ matrix.php-version }} ${{ matrix.debug }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                debug:
                    - ""
                include:
                    - php-version: "8.1"
                      debug: "debug"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y lcov libcap-dev libpfm4-dev

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: pcov
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2

            -   run: phpize

            -   run: ./configure --enable-compile-warnings=error --enable-perfidious-coverage "${EXTRA_FLAGS}"
                env:
                    EXTRA_FLAGS: ${{ matrix.debug == 'debug' && '--enable-perfidious-debug' || '' }}

            -   run: make

            # must run after make, not before: --initial captures baseline coverage from the
            # .gcno graph files gcc emits during compilation, which don't exist until after the build
            -   run: lcov --directory . --zerocounters

            -   run: lcov --directory . --capture --compat-libtool --initial --output-file coverage.info

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   run: cat tests/*.log
                if: failure()

            -   run: |
                    lcov --no-checksum --directory . --capture --compat-libtool --output-file coverage.info
                    lcov --remove coverage.info "/usr*" \
                        --remove coverage.info "*/.phpenv/*" \
                        --compat-libtool \
                        --ignore-errors unused \
                        --output-file coverage.info

            -   name: Upload coverage reports to Codecov
                uses: codecov/codecov-action@v7
                with:
                    files: coverage.info
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: jbboehr/php-perfifidous

            -   name: Coveralls
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    file: coverage.info
                    format: lcov
                    parallel: true

    finish:
        needs:
            - coverage
            - nix
        if: >-
            ${{
                always() &&
                (
                    github.event_name != 'push' ||
                    (
                        !startsWith(github.ref_name, 'windows/') &&
                        !startsWith(github.ref_name, 'darwin/')
                    )
                )
            }}
        runs-on: ubuntu-latest
        steps:
            -   name: Coveralls Finished
                uses: coverallsapp/github-action@v2
                with:
                    parallel-finished: true

    nix-matrix:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v7
            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   id: set-matrix
                name: Generate Nix Matrix
                run: |
                    set -Eeu
                    matrix="$(nix eval --json '.#githubActions.matrix')"
                    echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        name: "nix (${{ matrix.name }})"
        runs-on: ${{ matrix.os }}
        needs: nix-matrix
        strategy:
            matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}
        steps:
            -   uses: actions/checkout@v7

            -   name: Set Up Build Cache
                uses: actions/cache@v6
                id: nix-cache
                with:
                    path: /tmp/nix-store.nar
                    key: nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.attr }}
                    restore-keys: |
                        nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.attr }}
                        nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
                        nix-store.nar-${{ runner.os }}-

            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=

            -   name: Import Nix Store Cache
                if: "steps.nix-cache.outputs.cache-hit == 'true'"
                run: |
                    nix-store --import < /tmp/nix-store.nar

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: nix build -L ".#${{ matrix.attr }}"

            -   run: find -L result*; cp result-coverage/coverage.info coverage.info || true

            -   name: Upload coverage reports to Codecov
                if: ${{ hashFiles('coverage.info') != '' }}
                uses: codecov/codecov-action@v7
                with:
                    files: coverage.info
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: jbboehr/php-perfifidous

            -   name: Coveralls
                if: ${{ hashFiles('coverage.info') != '' }}
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    file: coverage.info
                    format: lcov
                    parallel: true

            -   name: Export Nix Store Cache
                shell: bash
                # partially based on https://github.com/NixOS/nix/issues/1245#issuecomment-282586759
                run: |
                    drv="$(nix-store -qd "$(readlink result)")"
                    drvRefs="$( echo "$drv" | xargs nix-store -q --references )"
                    ( echo "$drvRefs" | grep '[.]drv$' | xargs nix-store -q --outputs ;
                      echo "$drvRefs" | grep -v '[.]drv$' ) | \
                        xargs nix-store -r | \
                        xargs nix-store -qR |
                        xargs nix-store --export > /tmp/nix-store.nar

    docker:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                DOCKER_NAME:
                    - debian
        steps:
            -   uses: actions/checkout@v7
                with:
                    submodules: recursive
            -   run: sudo sysctl -w kernel.perf_event_paranoid=1
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    build-args: PHP_VERSION=${{ matrix.PHP_VERSION }}
                    tags: php-perfidious-${{ matrix.DOCKER_NAME }}
            -   name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I am putting everything in a FSCKING BASH SCRIPT
                env:
                    PHP_VERSION: ${{ matrix.PHP_VERSION }}
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                run: bash ./.github/scripts/docker.sh

    docker-fedora:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                DOCKER_NAME:
                    - fedora
        steps:
            -   uses: actions/checkout@v7
                with:
                    submodules: recursive
            -   run: sudo sysctl -w kernel.perf_event_paranoid=1
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    tags: php-perfidious-${{ matrix.DOCKER_NAME }}
            -   name: I am tired of writing this shit in YAML and learning a new DSL for every CI service so I am putting everything in a FSCKING BASH SCRIPT
                env:
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                    TEST_PHP_EXECUTABLE: /usr/bin/php
                run: bash ./.github/scripts/docker.sh
