name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
            - release
            - "release/**"
            - "windows/**"
            - "darwin/**"
        tags:
            - "v*"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    version:
        name: Package version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            -   uses: actions/checkout@v7

            -   name: Determine the package version and validate release tags
                id: version
                env:
                    REF_NAME: ${{ github.ref_name }}
                    REF_TYPE: ${{ github.ref_type }}
                run: |
                    version=$(sed -n 's/^#define PHP_PERFIDIOUS_VERSION "\(.*\)"/\1/p' php_perfidious.h)
                    if [[ -z "$version" ]]; then
                        echo "Missing extension version" >&2
                        exit 1
                    fi
                    if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
                        echo "Tag $REF_NAME does not match extension version $version" >&2
                        exit 1
                    fi
                    echo "tag=v$version" >> "$GITHUB_OUTPUT"
                    echo "version=$version" >> "$GITHUB_OUTPUT"

    lint:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2
                    extensions: json, opcache

            -   name: Validate composer.json and composer.lock
                run: composer validate --strict

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v6
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --ignore-platform-req=php+ --ignore-platform-req=ext-perfidious

            -   name: Validate API declarations
                run: |
                    php tools/generate-aggregate-stub.php --check
                    php -l tools/generate-aggregate-stub.php
                    php -l perfidious.stub.php
                    php -l stubs/common.stub.php
                    php -l stubs/linux.stub.php
                    php -l stubs/darwin.stub.php
                    php -l stubs/windows.stub.php
                    php perfidious.stub.php

            -   name: phpcs
                run: php vendor/bin/phpcs

            -   name: phpstan
                run: php vendor/bin/phpstan analyze

            -   name: phpstan API declarations
                run: |
                    php vendor/bin/phpstan analyze -c tests/phpstan/aggregate.neon --level=max --no-progress tests/phpstan/aggregate.inc
                    php vendor/bin/phpstan analyze -c extension.neon --level=max --no-progress tests/phpstan/linux.inc
                    php vendor/bin/phpstan analyze -c extension.darwin.neon --level=max --no-progress tests/phpstan/darwin.inc
                    php vendor/bin/phpstan analyze -c extension.windows.neon --level=max --no-progress tests/phpstan/windows.inc

    pie:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "PIE | PHP 8.1"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y libcap-dev libpfm4-dev

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "8.1"
                    tools: composer:v2

            -   name: Download and verify PIE
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    curl --proto '=https' --tlsv1.2 -fL \
                        --output "${RUNNER_TEMP}/pie.phar" \
                        https://github.com/php/pie/releases/latest/download/pie.phar
                    gh attestation verify --repo php/pie "${RUNNER_TEMP}/pie.phar"
                    php "${RUNNER_TEMP}/pie.phar" --version

            -   name: Install extension from checkout with PIE
                run: sudo php "${RUNNER_TEMP}/pie.phar" install --no-interaction --no-cache

            -   name: Verify extension is loaded
                run: php --ri perfidious

    windows:
        if: >-
            ${{
                github.event_name != 'push' ||
                !startsWith(github.ref_name, 'darwin/')
            }}
        name: "Windows | PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64"
        needs: version
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                ts: [nts, ts]
        steps:
            -   uses: actions/checkout@v7

            -   name: Include the license and exception in binary packages
                shell: bash
                run: cat LICENSE.md docs/LICENSE_EXCEPTION.md > LICENSE

            -   name: Build and test the Windows extension
                uses: php/php-windows-builder/extension@v1
                with:
                    extension-ref: ${{ needs.version.outputs.tag }}
                    php-version: "${{ matrix.php-version }}"
                    arch: x64
                    ts: "${{ matrix.ts }}"
                    args: --enable-perfidious
                    test-workers: "1"

            -   name: Install PHP for the packaged DLL check
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: "none"
                    tools: none
                    extensions: zip
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Check and extract the binary package
                shell: bash
                env:
                    RELEASE_TAG: ${{ needs.version.outputs.tag }}
                run: |
                    php <<'PHP'
                    <?php
                    $prefix = sprintf('artifacts/php_perfidious-%s-%d.%d-%s-', getenv('RELEASE_TAG'), PHP_MAJOR_VERSION, PHP_MINOR_VERSION, PHP_ZTS ? 'ts' : 'nts');
                    $archives = glob($prefix . '*-x86_64.zip');
                    if ($archives === false || count($archives) !== 1) {
                        throw new RuntimeException('Expected one binary package for this PHP configuration');
                    }
                    $zip = new ZipArchive();
                    if ($zip->open($archives[0]) !== true) {
                        throw new RuntimeException('Cannot open binary package');
                    }
                    $license = file_get_contents('LICENSE.md') . file_get_contents('docs/LICENSE_EXCEPTION.md');
                    if ($zip->getFromName('LICENSE') !== $license) {
                        throw new RuntimeException('Binary package is missing the complete license and exception');
                    }
                    $dll = pathinfo($archives[0], PATHINFO_FILENAME) . '.dll';
                    if ($zip->locateName($dll) === false) {
                        throw new RuntimeException('Binary package DLL name does not match its archive');
                    }
                    $directory = getenv('RUNNER_TEMP') . '/perfidious-package';
                    if (!$zip->extractTo($directory)) {
                        throw new RuntimeException('Cannot extract binary package');
                    }
                    $zip->close();
                    if (file_put_contents(getenv('GITHUB_ENV'), 'PACKAGE_DLL=' . $directory . '/' . $dll . PHP_EOL, FILE_APPEND) === false) {
                        throw new RuntimeException('Cannot export the packaged DLL path');
                    }
                    PHP

            -   name: Verify the packaged version and sampler
                shell: bash
                env:
                    RELEASE_TAG: ${{ needs.version.outputs.tag }}
                    EXPECTED_TS: ${{ matrix.ts }}
                run: |
                    php -n -d "extension=$PACKAGE_DLL" --ri perfidious
                    php -n -d "extension=$PACKAGE_DLL" -r 'if (phpversion("perfidious") !== substr(getenv("RELEASE_TAG"), 1) || (PHP_ZTS ? "ts" : "nts") !== getenv("EXPECTED_TS")) { throw new RuntimeException("Packaged release or PHP thread-safety mode does not match the matrix"); }'
                    # PHP expands these variables, not Bash.
                    # shellcheck disable=SC2016
                    php -n -d "extension=$PACKAGE_DLL" -r '$sampler = Perfidious\Sampler::open([Perfidious\Metric::CpuTime]); $sampler->read(); $sampler->close();'

    macos:
        if: >-
            ${{
                github.event_name != 'push' ||
                !startsWith(github.ref_name, 'windows/')
            }}
        name: "macOS | PHP ${{ matrix.php-version }} arm64"
        runs-on: macos-15
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.5"
        steps:
            -   uses: actions/checkout@v7

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"

            -   run: phpize

            -   run: ./configure --enable-compile-warnings=error

            -   run: make

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   name: Print test failure diagnostics
                run: find tests -type f \( -name '*.log' -o -name '*.diff' -o -name '*.mem' \) -print -exec cat {} \;
                if: failure()

            -   name: Verify extension is loaded
                run: php -n -d extension="$(pwd)/modules/perfidious.so" --ri perfidious

    nix-cache-darwin:
        if: >-
            ${{
                github.event_name != 'push' ||
                !startsWith(github.ref_name, 'windows/')
            }}
        name: Prepare macOS Nix dependencies
        runs-on: macos-15
        steps:
            -   uses: actions/checkout@v7
            -   uses: cachix/install-nix-action@v31
                with:
                    extra_nix_config: |
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   uses: nix-community/cache-nix-action/restore@v7
                id: nix-cache
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    lookup-only: true
            -   name: Prepare shared Nix dependencies
                if: steps.nix-cache.outputs.hit-primary-key != 'true'
                run: nix build -L .#ci-dependencies
            -   name: Save shared Nix dependencies
                if: success() && steps.nix-cache.outputs.hit-primary-key != 'true'
                uses: nix-community/cache-nix-action/save@v7
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    gc-max-store-size: 0

    macos-packages:
        if: >-
            ${{
                !cancelled() && needs.version.result == 'success' &&
                (
                    github.event_name != 'push' ||
                    !startsWith(github.ref_name, 'windows/')
                )
            }}
        name: "Package | PHP ${{ matrix.php-version }} ${{ matrix.ts }} arm64 macOS"
        needs: [version, nix-cache-darwin]
        runs-on: macos-15
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                ts: [nts, ts]
        env:
            MACOSX_DEPLOYMENT_TARGET: "11.0"
            EXPECTED_TS: ${{ matrix.ts }}
            EXPECTED_PHP_VERSION: ${{ matrix.php-version }}
        steps:
            -   uses: actions/checkout@v7

            -   name: Select the Nix package
                env:
                    RELEASE_PHP: ${{ matrix.php-version }}
                    RELEASE_TS: ${{ matrix.ts }}
                run: |
                    if [[ "$RELEASE_TS" == ts ]]; then
                        RELEASE_TS=zts
                    fi
                    echo "RELEASE_TARGET=packages.aarch64-darwin.release-php${RELEASE_PHP//./}-darwin-${RELEASE_TS}" >> "$GITHUB_ENV"

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: "none"
                    tools: none
                    extensions: json, opcache
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Verify the PHP build
                run: |
                    test "$(lipo -archs "$(command -v php)")" = arm64
                    php -r 'if (PHP_OS_FAMILY !== "Darwin" || PHP_DEBUG || PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION !== getenv("EXPECTED_PHP_VERSION") || (PHP_ZTS ? "ts" : "nts") !== getenv("EXPECTED_TS")) { throw new RuntimeException("PHP does not match the macOS release matrix"); }'

            -   uses: cachix/install-nix-action@v31
                with:
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   uses: nix-community/cache-nix-action@v7
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    save: false

            -   name: Build and check the release package with Nix
                run: nix build -L ".#${RELEASE_TARGET}"

            -   name: Extract the ARM64 package
                id: package
                run: |
                    archives=(result/*.zip)
                    test "${#archives[@]}" = 1
                    archive="${archives[0]}"
                    unzip -q "$archive" -d "${RUNNER_TEMP}/perfidious-package"
                    cmp LICENSE.md "${RUNNER_TEMP}/perfidious-package/LICENSE.md"
                    cmp docs/LICENSE_EXCEPTION.md "${RUNNER_TEMP}/perfidious-package/LICENSE_EXCEPTION.md"
                    echo "archive=$archive" >> "$GITHUB_OUTPUT"
                    echo "name=$(basename "$archive")" >> "$GITHUB_OUTPUT"

            -   name: Verify the packaged version and sampler
                env:
                    RELEASE_TAG: ${{ needs.version.outputs.tag }}
                run: |
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" --ri perfidious
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" -r 'if (phpversion("perfidious") !== substr(getenv("RELEASE_TAG"), 1)) { throw new RuntimeException("Packaged extension version does not match the release"); }'
                    # PHP expands these variables, not Bash.
                    # shellcheck disable=SC2016
                    php -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" -r '$sampler = Perfidious\Sampler::open([Perfidious\Metric::CpuTime]); $sampler->read(); $sampler->close();'

            -   name: Run the packaged module's tests with PHP outside Nix
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1
                run: |
                    TEST_PHP_EXECUTABLE=$(command -v php)
                    export TEST_PHP_EXECUTABLE
                    # The PHP test runner writes helper files beside itself.
                    test_runner="${RUNNER_TEMP}/run-tests.php"
                    cp "$(nix eval --raw ".#${RELEASE_TARGET}.module.php.unwrapped.dev")/lib/build/run-tests.php" "$test_runner"
                    php -n "$test_runner" -q -n -d "extension=${RUNNER_TEMP}/perfidious-package/perfidious.so" tests

            -   name: Print test failure diagnostics
                if: failure()
                run: find tests -type f \( -name '*.log' -o -name '*.diff' -o -name '*.mem' \) -print -exec cat {} \;

            -   name: Upload the binary package
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ steps.package.outputs.name }}
                    path: ${{ steps.package.outputs.archive }}
                    if-no-files-found: error

    linux-packages:
        if: >-
            ${{
                !cancelled() && needs.version.result == 'success' &&
                (
                    github.event_name != 'push' ||
                    (
                        !startsWith(github.ref_name, 'windows/') &&
                        !startsWith(github.ref_name, 'darwin/')
                    )
                )
            }}
        name: "Package | PHP ${{ matrix.php-version }} nts x64 Linux ${{ matrix.libc }}"
        needs: [version, nix-matrix]
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
                libc: [glibc, musl]
                include:
                    -   libc: glibc
                        image: bookworm
                    -   libc: musl
                        image: alpine3.22
        steps:
            -   uses: actions/checkout@v7

            -   name: Select the Nix package
                env:
                    RELEASE_PHP: ${{ matrix.php-version }}
                    RELEASE_LIBC: ${{ matrix.libc }}
                run: echo "RELEASE_TARGET=packages.x86_64-linux.release-php${RELEASE_PHP//./}-${RELEASE_LIBC}" >> "$GITHUB_ENV"

            -   uses: cachix/install-nix-action@v31
                with:
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   uses: nix-community/cache-nix-action@v7
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    save: false

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   name: Build and check the release package with Nix
                run: nix build -L ".#${RELEASE_TARGET}"

            -   name: Test the ZIP in a PHP installation without Nix
                env:
                    EXPECTED_VERSION: ${{ needs.version.outputs.version }}
                    EXPECTED_PHP_VERSION: ${{ matrix.php-version }}
                    RELEASE_LIBC: ${{ matrix.libc }}
                    RELEASE_IMAGE: ${{ matrix.image }}
                run: |
                    archive="php_perfidious-v${EXPECTED_VERSION}_php${EXPECTED_PHP_VERSION}-x86_64-linux-${RELEASE_LIBC}-nts.zip"
                    docker run --rm \
                        --cap-add CAP_PERFMON \
                        -v "$PWD:/source:ro" -v "$(readlink -f result):/packages:ro" \
                        -e EXPECTED_VERSION -e EXPECTED_PHP_VERSION \
                        "php:${EXPECTED_PHP_VERSION}-cli-${RELEASE_IMAGE}" \
                        sh /source/tools/test-linux-release.sh "/packages/$archive"

            -   name: Upload the binary package
                uses: actions/upload-artifact@v7
                with:
                    name: php_perfidious-${{ needs.version.outputs.tag }}_php${{ matrix.php-version }}-x86_64-linux-${{ matrix.libc }}-nts.zip
                    path: result/*.zip
                    if-no-files-found: error

    test:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }} ${{ matrix.debug }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                debug:
                    - ""
                include:
                    - php-version: "8.1"
                      debug: "debug"
                    - php-version: "8.4"
                      debug: "debug"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y libcap-dev libpfm4-dev valgrind dash python3

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "none"
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2

            -   name: Verify instrumentation options under Dash and Bash
                if: matrix.php-version == '8.1' && matrix.debug == ''
                run: python3 tests/configure-options.py

            -   run: phpize

            -   name: Compile a Linux consumer of the installed public header
                run: |
                    read -r -a php_includes <<< "$(php-config --includes)"
                    cc "${php_includes[@]}" -I. -fsyntax-only tests/header-linux-consumer.c

            -   run: ./configure --enable-compile-warnings=error "${EXTRA_FLAGS}"
                env:
                    EXTRA_FLAGS: ${{ matrix.debug == 'debug' && '--enable-perfidious-debug' || '' }}

            -   run: make

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   run: make test TEST_PHP_ARGS='-m'
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1
                    USE_ZEND_ALLOC: 0

            -   name: Print test failure diagnostics
                run: find tests -type f \( -name '*.log' -o -name '*.diff' -o -name '*.mem' \) -print -exec cat {} \;
                if: failure()

    coverage:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        name: "Coverage | PHP ${{ matrix.php-version }} ${{ matrix.debug }}"
        strategy:
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                debug:
                    - ""
                include:
                    - php-version: "8.1"
                      debug: "debug"
        steps:
            -   uses: actions/checkout@v7

            -   run: sudo apt-get update && sudo apt-get install -y lcov libcap-dev libpfm4-dev

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    coverage: pcov
                    extensions: json, opcache
                    php-version: "${{ matrix.php-version }}"
                    tools: composer:v2

            -   run: phpize

            -   run: ./configure --enable-compile-warnings=error --enable-perfidious-coverage "${EXTRA_FLAGS}"
                env:
                    EXTRA_FLAGS: ${{ matrix.debug == 'debug' && '--enable-perfidious-debug' || '' }}

            -   run: make

            # must run after make, not before: --initial captures baseline coverage from the
            # .gcno graph files gcc emits during compilation, which don't exist until after the build
            -   run: lcov --directory . --zerocounters

            -   run: lcov --directory . --capture --compat-libtool --initial --output-file coverage.info

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: make test
                env:
                    NO_INTERACTION: 1
                    REPORT_EXIT_STATUS: 1

            -   name: Print test failure diagnostics
                run: find tests -type f \( -name '*.log' -o -name '*.diff' -o -name '*.mem' \) -print -exec cat {} \;
                if: failure()

            -   run: |
                    lcov --no-checksum --directory . --capture --compat-libtool --output-file coverage.info
                    lcov --remove coverage.info "/usr*" \
                        --remove coverage.info "*/.phpenv/*" \
                        --compat-libtool \
                        --ignore-errors unused \
                        --output-file coverage.info

            -   name: Upload coverage reports to Codecov
                uses: codecov/codecov-action@v7
                with:
                    files: coverage.info
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: jbboehr/php-perfidious

            -   name: Coveralls
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    file: coverage.info
                    format: lcov
                    parallel: true

    finish:
        needs:
            - coverage
            - nix
        if: >-
            ${{
                always() &&
                (
                    github.event_name != 'push' ||
                    (
                        !startsWith(github.ref_name, 'windows/') &&
                        !startsWith(github.ref_name, 'darwin/')
                    )
                )
            }}
        runs-on: ubuntu-latest
        steps:
            -   name: Coveralls Finished
                uses: coverallsapp/github-action@v2
                with:
                    parallel-finished: true

    nix-matrix:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v7
            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   id: set-matrix
                name: Generate Nix Matrix
                run: |
                    set -Eeu
                    matrix="$(nix eval --json '.#githubActions.matrix')"
                    echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            -   uses: nix-community/cache-nix-action/restore@v7
                id: nix-cache
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    lookup-only: true
            -   name: Prepare shared Nix dependencies
                if: steps.nix-cache.outputs.hit-primary-key != 'true'
                run: nix build -L .#ci-dependencies
            -   name: Save shared Nix dependencies
                if: success() && steps.nix-cache.outputs.hit-primary-key != 'true'
                uses: nix-community/cache-nix-action/save@v7
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    gc-max-store-size: 0

    nix:
        if: >-
            ${{
                !cancelled() && needs.nix-matrix.outputs.matrix != '' &&
                (
                    github.event_name != 'push' ||
                    (
                        !startsWith(github.ref_name, 'windows/') &&
                        !startsWith(github.ref_name, 'darwin/')
                    )
                )
            }}
        name: "nix (${{ matrix.name }})"
        runs-on: ${{ matrix.os }}
        needs: nix-matrix
        strategy:
            matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}
        steps:
            -   uses: actions/checkout@v7

            -   uses: cachix/install-nix-action@v31
                with:
                    extra_nix_config: |
                        system-features = nixos-test benchmark big-parallel kvm
                        extra-substituters = https://fossar.cachix.org
                        extra-trusted-public-keys = fossar.cachix.org-1:Zv6FuqIboeHPWQS7ysLCJ7UT7xExb4OE8c4LyGb5AsE=
            -   uses: nix-community/cache-nix-action@v7
                with:
                    primary-key: nix-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix') }}
                    save: false

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: nix build -L ".#${{ matrix.attr }}"

            -   run: find -L result*; cp result-coverage/coverage.info coverage.info || true

            -   name: Upload coverage reports to Codecov
                if: ${{ hashFiles('coverage.info') != '' }}
                uses: codecov/codecov-action@v7
                with:
                    files: coverage.info
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: jbboehr/php-perfidious

            -   name: Coveralls
                if: ${{ hashFiles('coverage.info') != '' }}
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    file: coverage.info
                    format: lcov
                    parallel: true

    docker:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                DOCKER_NAME:
                    - debian
        steps:
            -   uses: actions/checkout@v7
                with:
                    submodules: recursive
            -   run: sudo sysctl -w kernel.perf_event_paranoid=1
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    load: true
                    cache-from: type=gha,scope=${{ matrix.DOCKER_NAME }}-${{ matrix.PHP_VERSION }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.DOCKER_NAME }}-${{ matrix.PHP_VERSION }}
                    build-args: PHP_VERSION=${{ matrix.PHP_VERSION }}
                    tags: php-perfidious-${{ matrix.DOCKER_NAME }}
            -   name: Run Debian container tests
                env:
                    PHP_VERSION: ${{ matrix.PHP_VERSION }}
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                run: bash ./.github/scripts/docker.sh

    docker-fedora:
        if: >-
            ${{
                github.event_name != 'push' ||
                (
                    !startsWith(github.ref_name, 'windows/') &&
                    !startsWith(github.ref_name, 'darwin/')
                )
            }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                DOCKER_NAME:
                    - fedora
        steps:
            -   uses: actions/checkout@v7
                with:
                    submodules: recursive
            -   run: sudo sysctl -w kernel.perf_event_paranoid=1
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    load: true
                    cache-from: type=gha,scope=${{ matrix.DOCKER_NAME }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.DOCKER_NAME }}
                    tags: php-perfidious-${{ matrix.DOCKER_NAME }}
            -   name: Run Fedora container tests
                env:
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                    TEST_PHP_EXECUTABLE: /usr/bin/php
                run: bash ./.github/scripts/docker.sh

    publish:
        name: Check release packages and update releases
        needs: [version, lint, pie, windows, macos, macos-packages, linux-packages, test, coverage, nix, docker, docker-fedora]
        permissions:
            contents: write
        uses: ./.github/workflows/publish.yml
        with:
            tag: ${{ needs.version.outputs.tag }}
